name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON: python

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The contract is not on PyPI, so it is installed first, at the version pyproject.toml pins.
      - run: |
          ref=v$(grep -o 'leitstand-robot-contract==[0-9.]*' pyproject.toml | cut -d= -f3)
          pip install "git+https://github.com/AI-RLA/leitstand-robot-contract.git@${ref}"
      - run: pip install -e ".[dev]"
      - run: make ruff
      - run: make format-check
      - run: make pytest-cov
      - run: make openapi-check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml
