services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leitstand}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leitstand}
      POSTGRES_DB: ${POSTGRES_DB:-leitstand}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-leitstand}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  zenoh-router:
    image: eclipse/zenoh:1.9.0
    command: ["-c", "/etc/zenoh/router.json5"]
    volumes:
      - ./config/zenoh_router.json5:/etc/zenoh/router.json5:ro
    ports:
      - "7447:7447"
    restart: unless-stopped

  coverage-planner:
    build:
      context: ./coverage-planner
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    # The one reachable risk here is a memory-safety bug in Fields2Cover's own C++, so the
    # container is given nothing to escalate with.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        contract-src: ../leitstand-robot-contract
    environment:
      LEITSTAND_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-leitstand}:${POSTGRES_PASSWORD:-leitstand}@postgres:5432/${POSTGRES_DB:-leitstand}
      LEITSTAND_ZENOH_ENDPOINT: tcp/zenoh-router:7447
      LEITSTAND_AUTO_MIGRATE: "true"
      LEITSTAND_COVERAGE_PLANNER_URL: http://coverage-planner:8090
    ports:
      - "8080:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No dependency on the planner, deliberately: a planner that is down or still building must
    # cost coverage planning and nothing else.
    depends_on:
      postgres:
        condition: service_healthy
      zenoh-router:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
