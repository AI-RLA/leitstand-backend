[project]
name = "leitstand-backend"
version = "0.3.0"
description = "Leitstand Backend"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Jannik Jose" },
]

dependencies = [
    "eclipse-zenoh>=1.0.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "structlog>=24.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "geojson-pydantic==1.2.0",
    "geoalchemy2==0.16.0",
    "leitstand-robot-contract==0.1.0",
    "protobuf>=7.35.1",
    "pydantic-ai-slim[openai]==2.26.0",
    "fastmcp==3.4.6",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.12",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx",
    "protovalidate>=1.2",
]

[project.scripts]
leitstand-backend = "leitstand_backend.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["leitstand_backend*"]

# The system prompt ships as a data file inside the package. Without this it is absent from the
# wheel and the agent fails to build at import, which no test in this repo would catch.
[tool.setuptools.package-data]
leitstand_backend = ["adapters/outbound/llm/prompts/*.md"]

# ---------------- Ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--tb=short"
pythonpath = [".", "tests"]
