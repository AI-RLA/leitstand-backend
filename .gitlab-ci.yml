default:
  image: python:3.11
  cache:
    key:
      files: [pyproject.toml]
    paths:
      - .cache/pip
  before_script:
    - pip install -e ".[dev]"

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PYTHON: python

stages: [check]

ruff:
  stage: check
  script: [make ruff]

format-check:
  stage: check
  script: [make format-check]

test:
  stage: check
  script: [make pytest-cov]
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

openapi:
  stage: check
  script: [make openapi-check]
