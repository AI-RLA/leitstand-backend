default:
  image: python:3.11
  cache:
    key:
      files: [pyproject.toml]
    paths:
      - .cache/pip
  before_script:
    # Install the robot contract from its GitLab repo at ROBOT_CONTRACT_REF
    # before the backend, so the leitstand-robot-contract dependency resolves.
    - pip install "git+https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/agro-technicum/ag-intelligente-agrarsysteme/workinggroup-projects/leitstand/leitstand-robot-contract.git@${ROBOT_CONTRACT_REF}"
    - pip install -e ".[dev]"

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PYTHON: python
  # Git ref (tag or commit) of leitstand-robot-contract the backend builds
  # against; bump when the wire changes.
  ROBOT_CONTRACT_REF: v0.1.0

stages: [check]

ruff:
  stage: check
  script: [make ruff]

format-check:
  stage: check
  script: [make format-check]

test:
  stage: check
  script: [make pytest-cov]
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

openapi:
  stage: check
  script: [make openapi-check]
